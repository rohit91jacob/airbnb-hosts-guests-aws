name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: utf-8
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  # Real-data fixtures are built from a live download (Inside Airbnb asks people not to
  # republish its data, so none is committed) and cached until the snapshot set changes.
  FIXTURE_CITIES: singapore,amsterdam
  AIRBNB_FIXTURES_DIR: ${{ github.workspace }}/tests/fixtures/insideairbnb
  AIRBNB_REQUIRE_FIXTURES: "1"
  TERRAFORM_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"

jobs:
  lint:
    name: lint (pre-commit - ruff, gitleaks, terraform fmt, hygiene)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  unit:
    name: unit tests (synthetic vectors)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/unit --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage.xml

  fixtures:
    name: real-data fixtures (download once, cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Fingerprint the current snapshot set (one small JSON request)
        id: key
        env:
          AIRBNB_CITIES: ${{ env.FIXTURE_CITIES }}
          AIRBNB_DATA_DIR: /tmp/fingerprint
        run: echo "key=iab-fixtures-$(uv run airbnb discover --fingerprint)-${{ hashFiles('src/airbnb_lakehouse/fixtures.py') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/insideairbnb
          key: ${{ steps.key.outputs.key }}
      - name: Build the sample from a live download
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          AIRBNB_DATA_DIR: /tmp/iab-download
        run: make fixtures FIXTURE_CITIES=${{ env.FIXTURE_CITIES }}
      - run: du -sh tests/fixtures/insideairbnb && cat tests/fixtures/insideairbnb/catalog.json | head -30

  pipeline:
    name: pipeline on fixtures (state machine, dbt build, e2e + idempotency)
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AIRBNB_SOURCE: fixtures
      AIRBNB_DATA_DIR: /tmp/airbnb-ci
      DBT_TARGET: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/insideairbnb
          key: ${{ needs.fixtures.outputs.key }}
          fail-on-cache-miss: true
      - run: uv sync --frozen
      - name: Walk the Step Functions definition (exit 3 = data-quality gate failed)
        run: uv run airbnb run --target ci --site site
      - name: dbt build again on the same warehouse (standalone dbt, no SCD2 round)
        working-directory: dbt
        env:
          AIRBNB_DUCKDB_PATH: /tmp/airbnb-ci/warehouse/airbnb.duckdb
        run: |
          uv run dbt build --profiles-dir . --target ci --vars '{as_of_round: "2100-01-01"}' --exclude resource_type:snapshot
      - name: End-to-end tests (rerun idempotency, full-refresh equivalence, failing gate)
        run: uv run pytest -m e2e tests/e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-from-fixtures
          path: site

  dbt-athena:
    name: dbt compile for the Athena target (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --group athena
      - run: make dbt-compile-athena
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: athena-compiled-sql
          path: dbt/target-athena/compiled

  aws-moto:
    name: AWS paths on moto (S3, Glue + Iceberg, Step Functions, Scheduler, Athena)
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/insideairbnb
          key: ${{ needs.fixtures.outputs.key }}
          fail-on-cache-miss: true
      - run: uv sync --frozen
      - run: uv run pytest -m aws tests/aws

  localstack:
    name: AWS paths on LocalStack (S3, Iceberg on S3, Step Functions, Scheduler, SNS)
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LOCALSTACK_IMAGE: localstack/localstack:2026.09.1
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/insideairbnb
          key: ${{ needs.fixtures.outputs.key }}
          fail-on-cache-miss: true
      - run: uv sync --frozen
      - name: Start LocalStack
        id: ls
        run: |
          docker run -d --name localstack -p 4566:4566 \
            -e SERVICES=s3,sns,stepfunctions,scheduler,iam,sts \
            -e LOCALSTACK_AUTH_TOKEN="${LOCALSTACK_AUTH_TOKEN}" "$LOCALSTACK_IMAGE"
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "up=true" >> "$GITHUB_OUTPUT"; curl -s http://localhost:4566/_localstack/health; exit 0
            fi
            sleep 3
          done
          docker logs localstack | tail -40
          if [ -z "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "::warning::LocalStack did not start without an auth token; set the LOCALSTACK_AUTH_TOKEN secret to run this job. The moto job covers the same code paths."
            echo "up=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          exit 1
      - name: Pipeline AWS paths against LocalStack (SQLite catalog, Iceberg warehouse on S3)
        if: steps.ls.outputs.up == 'true'
        env:
          AIRBNB_AWS_TEST_ENDPOINT: http://localhost:4566
          AIRBNB_AWS_TEST_CATALOG: sql
        run: uv run pytest -m aws tests/aws -v
      - name: LocalStack logs
        if: always() && steps.ls.outputs.up == 'true'
        run: docker logs localstack | tail -100

  terraform:
    name: terraform (fmt, validate, tflint, checkov)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: tflint --init && tflint --recursive --config "$(pwd)/.tflint.hcl" --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: checkov (every skip is justified inline)
        run: uvx --from checkov==3.3.26 checkov -d . --framework terraform --compact --quiet

  docker:
    name: container image builds and runs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: airbnb-hosts-guests:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: CLI runs as the non-root user on a read-only root filesystem
        run: |
          docker run --rm --read-only --tmpfs /tmp airbnb-hosts-guests:ci airbnb --help
          docker run --rm --read-only --tmpfs /tmp airbnb-hosts-guests:ci id -u | grep -qx 10001
