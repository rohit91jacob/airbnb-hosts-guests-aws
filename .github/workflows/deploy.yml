name: deploy

# Ships a new pipeline image to a REAL AWS account. Disabled unless the repository variable
# AWS_DEPLOY_ROLE_ARN is set (Terraform output `github_deploy_role_arn`). Authentication is
# GitHub OIDC federation: no static AWS keys exist anywhere. The infrastructure itself is
# applied by a person with `terraform apply`; this workflow only pushes the image, registers a
# task-definition revision that uses it, and optionally starts one pipeline execution.

on:
  workflow_dispatch:
    inputs:
      start_execution:
        description: "Start one pipeline execution after the deploy"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: aws
    permissions:
      contents: read
      id-token: write # OIDC token for sts:AssumeRoleWithWebIdentity
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      TASK_FAMILY: ${{ vars.TASK_FAMILY || 'airbnb-hosts-guests-dev' }}
      STATE_MACHINE_ARN: ${{ vars.STATE_MACHINE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}
      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}
          provenance: false
      - name: Register a task-definition revision with the new image
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > td.json
          jq --arg img "$ECR_REPOSITORY_URL:$GITHUB_SHA" '
            .containerDefinitions[0].image = $img
            | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions, volumes,
               requiresCompatibilities, cpu, memory, runtimePlatform, ephemeralStorage}' td.json > new.json
          aws ecs register-task-definition --cli-input-json file://new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text
      - name: Start one execution
        if: ${{ inputs.start_execution && env.STATE_MACHINE_ARN != '' }}
        run: aws stepfunctions start-execution --state-machine-arn "$STATE_MACHINE_ARN" --input '{"trigger":"deploy"}'
