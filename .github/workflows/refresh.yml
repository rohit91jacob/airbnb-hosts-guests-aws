name: refresh

# Scheduled data refresh: check Inside Airbnb for new snapshots, run the whole pipeline
# (walking the Step Functions definition locally, AWS emulated), reconcile with the live city
# dashboards, and publish the results site to GitHub Pages. No credentials are needed: Inside
# Airbnb is public and Pages uses the built-in GITHUB_TOKEN.

on:
  schedule:
    # Monthly. Inside Airbnb publishes each city about once a quarter, on no fixed day, and the
    # free archive keeps roughly the last 12 months. A monthly check picks up a new snapshot
    # within a month. When nothing is new, landing and bronze are no-ops (snapshot files are
    # immutable per date) and only dbt, the checks and the site rebuild.
    - cron: "17 5 4 * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Rebuild the SCD2 history from scratch (replays every snapshot in bronze)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  UV_LOCKED: "1"
  PYTHON_VERSION: "3.12"
  PYTHONIOENCODING: utf-8
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  # A fixed path: landing, Iceberg lake and warehouse are cached between runs. Each file is
  # then downloaded once (Inside Airbnb asks for exactly that) and SCD2 history keeps
  # snapshots that have dropped out of the free 12-month window.
  AIRBNB_DATA_DIR: /home/runner/airbnb-lake
  AIRBNB_CITIES: amsterdam,austin,singapore
  AIRBNB_SNAPSHOTS_PER_CITY: "2"
  AIRBNB_LOG_FORMAT: json

jobs:
  build:
    name: refresh lake + build site
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Restore the lake from the previous run
        id: lake
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AIRBNB_DATA_DIR }}
          key: airbnb-lake-${{ github.run_id }}
          restore-keys: airbnb-lake-
      - name: Report lake state
        run: |
          if [ -n "${{ steps.lake.outputs.cache-matched-key }}" ]; then
            echo "restored from: ${{ steps.lake.outputs.cache-matched-key }}"; du -sh "$AIRBNB_DATA_DIR"
          else
            echo "restored from: nothing (fresh lake; full download)"
          fi
      - run: uv sync --frozen
      - name: Pipeline (exit 3 = data-quality gate failed)
        run: uv run airbnb run --site site ${{ inputs.full_refresh && '--full-refresh' || '' }}
      - name: Save the lake for the next run
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.AIRBNB_DATA_DIR }}
          key: airbnb-lake-${{ github.run_id }}
      - name: Reconcile with the live Inside Airbnb dashboards (headless Chrome)
        run: uv run airbnb verify --capture
      - name: Build the results site
        run: |
          uv run airbnb report --out site
          {
            echo "### Results site"; echo '```json'; cat site/summary.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  alert:
    name: open or update a failure issue
    needs: [build, deploy]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Scheduled refresh is failing
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or comment on the tracking issue
        run: |
          body="The scheduled \`refresh\` run failed: $RUN_URL

          See docs/runbook.md#scheduled-refresh-fails. Close this issue once a run is green."
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
