# Targets:
#   dev / ci - DuckDB file written by the pipeline (bronze is exposed as views over Iceberg).
#   athena   - the AWS deployment: Glue-catalogued Iceberg tables queried through the
#              workgroup Terraform creates. CI only *compiles* this target (no AWS account).
airbnb:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('AIRBNB_DUCKDB_PATH', '../data/warehouse/airbnb.duckdb') }}"
      threads: "{{ env_var('AIRBNB_DBT_THREADS', '4') | int }}"
      extensions: [iceberg]
      settings:
        memory_limit: "{{ env_var('AIRBNB_DUCKDB_MEMORY_LIMIT', '4GB') }}"
        preserve_insertion_order: false
    ci:
      type: duckdb
      path: "{{ env_var('AIRBNB_DUCKDB_PATH', '../data/warehouse/airbnb_ci.duckdb') }}"
      threads: 2
      extensions: [iceberg]
      settings:
        memory_limit: "{{ env_var('AIRBNB_DUCKDB_MEMORY_LIMIT', '2GB') }}"
        preserve_insertion_order: false
    athena:
      type: athena
      region_name: "{{ env_var('AWS_REGION', 'eu-west-1') }}"
      database: awsdatacatalog
      schema: "{{ env_var('AIRBNB_GLUE_DB_PREFIX', 'airbnb') }}"
      work_group: "{{ env_var('AIRBNB_ATHENA_WORKGROUP', 'airbnb-hosts-guests') }}"
      s3_staging_dir: "{{ env_var('AIRBNB_ATHENA_RESULTS_S3', 's3://example-athena-results/dbt/') }}"
      s3_data_dir: "{{ env_var('AIRBNB_ATHENA_DATA_S3', 's3://example-lake/warehouse/dbt/') }}"
      s3_data_naming: schema_table_unique
      threads: 4
      num_retries: 2
